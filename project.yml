name: Cropmark
options:
  bundleIdPrefix: com.kivixiao
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO      # 测试宿主要注入 xctest
    Release:
      ENABLE_HARDENED_RUNTIME: YES     # 公证要求
targets:
  Cropmark:
    type: application
    platform: macOS
    sources:
      - path: Cropmark
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Cropmark/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cropmark
        CFBundleName: Cropmark
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 kivi. MIT License."
        LSApplicationCategoryType: public.app-category.utilities
        NSScreenCaptureUsageDescription: "Cropmark 需要「屏幕录制」权限才能截取屏幕内容。"
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kivixiao.cropmark
        PRODUCT_NAME: Cropmark
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  CropmarkTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CropmarkTests]
    dependencies:
      - target: Cropmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kivixiao.cropmark.tests
        GENERATE_INFOPLIST_FILE: YES
