name: Cropmark
options:
  bundleIdPrefix: com.kivixiao
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO      # 测试宿主要注入 xctest
    Release:
      ENABLE_HARDENED_RUNTIME: YES     # 公证要求
targets:
  Cropmark:
    type: application
    platform: macOS
    sources:
      - path: Cropmark
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: Cropmark/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cropmark
        CFBundleName: Cropmark
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "4"
        LSUIElement: true
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 kivi. MIT License."
        LSApplicationCategoryType: public.app-category.utilities
        NSScreenCaptureUsageDescription: "Cropmark 需要「屏幕录制」权限才能截取屏幕内容。"
        # Sparkle 自动更新：appcast 放在仓库 docs/ 下，随发布一起提交；公钥由 generate_keys 生成
        SUFeedURL: "https://raw.githubusercontent.com/phoxiao/cropmark/main/docs/appcast.xml"
        SUPublicEDKey: "aU7oZU8+tdYGu9yDUEHRi4XlbV2z7eoDXCJF1GoPQF8="
        SUScheduledCheckInterval: 86400
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kivixiao.cropmark
        PRODUCT_NAME: Cropmark
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  CropmarkTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CropmarkTests]
    dependencies:
      - target: Cropmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kivixiao.cropmark.tests
        GENERATE_INFOPLIST_FILE: YES
